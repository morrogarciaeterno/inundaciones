<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Territoria - Mapa hídrico real</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--panel:390px;--blue:#1769aa;--line:#d9e2e8}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17232b}body{background:#eaf0f3}.app{height:100%;display:grid;grid-template-columns:var(--panel) 1fr}.panel{background:#fff;z-index:900;overflow:auto;border-right:1px solid var(--line);box-shadow:4px 0 18px #2436421e}.top{padding:16px;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0}.sub{font-size:12px;color:#64737d;margin-top:4px}.state{margin-top:10px;padding:9px 11px;border-radius:9px;background:#eef5fa;color:#345160;font-size:12px}.content{padding:16px}.empty{padding:26px 10px;text-align:center;color:#687983}.place{font-size:19px;font-weight:750}.dept{font-size:13px;color:#687983;margin-top:2px}.status{display:inline-block;margin:10px 0;padding:5px 9px;border-radius:18px;background:#e8f7ee;color:#187642;font-size:12px;font-weight:700}.value{font-size:34px;font-weight:780;color:var(--blue);line-height:1}.unit{font-size:12px;color:#6a7982}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.box{border:1px solid var(--line);border-radius:10px;padding:10px}.lab{font-size:10px;color:#71818b;text-transform:uppercase}.val{font-size:13px;font-weight:650;margin-top:3px;word-break:break-word}.chartWrap{height:230px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.notice{font-size:11px;color:#6c7b84;background:#f5f8fa;padding:10px;border-radius:8px;margin-top:14px}.mapWrap{position:relative;min-width:0}#map{height:100%;width:100%}.counter{position:absolute;top:12px;left:50px;z-index:700;background:#fff;padding:8px 11px;border-radius:9px;box-shadow:0 2px 12px #1113;font-size:12px;font-weight:650}.leaflet-tooltip{font-size:11px}.dot{border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #0008}.mobileClose{display:none}@media(max-width:760px){.app{display:block}.mapWrap,#map{height:100%}.panel{position:fixed;left:0;right:0;bottom:0;height:46%;border-radius:18px 18px 0 0;border-right:0;transform:translateY(calc(100% - 62px));transition:.25s;z-index:1000}.panel.open{transform:translateY(0)}.top{cursor:pointer}.mobileClose{display:block;float:right;border:0;background:#edf2f5;border-radius:50%;width:30px;height:30px}.counter{left:10px;top:10px}.chartWrap{height:180px}}
</style>
</head>
<body><div class="app">
<aside class="panel" id="panel"><div class="top" id="panelTop"><button class="mobileClose" id="close">×</button><h1>💧 Estadística hídrica</h1><div class="sub">Toca un punto del mapa para ver sus datos</div><div class="state" id="loadState">Cargando datos reales de DGI Mendoza…</div></div><div class="content" id="detail"><div class="empty">Selecciona una estación o punto de medición.</div></div></aside>
<main class="mapWrap"><div class="counter" id="counter">Puntos: 0</div><div id="map"></div></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
const DGI_URL='https://serviciosweb.cloud.irrigacion.gov.ar/services/telemetria/api/public/dato-medicions/fullDto?distribucionCodigo.equals=2&redPrimaria.equals=false&redPrimaria.equalsActive=true';
// Si DGI bloquea CORS, reemplaza la línea siguiente por la URL de tu Worker proxy.
const DATA_URL=DGI_URL;
const map=L.map('map',{zoomControl:true}).setView([-32.89,-68.84],8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const group=L.featureGroup().addTo(map);let chart;
const get=(o,paths)=>{for(const p of paths){let v=p.split('.').reduce((a,k)=>a&&a[k],o);if(v!==undefined&&v!==null&&v!=='')return v}return null};
const num=v=>{if(typeof v==='string')v=v.replace(',','.');v=Number(v);return Number.isFinite(v)?v:null};
function flattenPayload(j){if(Array.isArray(j))return j;for(const k of ['content','data','results','items'])if(Array.isArray(j?.[k]))return j[k];return []}
function normalize(x,i){
 const lat=num(get(x,['latitud','latitude','lat','puntoMedicion.latitud','estacion.latitud','datoMedicion.latitud','ubicacion.latitud']));
 const lon=num(get(x,['longitud','longitude','lng','lon','puntoMedicion.longitud','estacion.longitud','datoMedicion.longitud','ubicacion.longitud']));
 const value=num(get(x,['valor','caudal','medicion','valorMedicion','dato','ultimaMedicion.valor','medicion.valor','datoMedicion.valor']));
 const name=get(x,['nombre','descripcion','puntoMedicion.nombre','estacion.nombre','nombrePuntoMedicion','datoMedicion.nombre'])||`Punto ${i+1}`;
 const river=get(x,['cauceNombre','cauce.nombre','rio','canal','redNombre','distribucionNombre'])||'Red hídrica DGI';
 const date=get(x,['fecha','fechaMedicion','ultimaMedicion.fecha','medicion.fecha','createdDate','fechaHora'])||'Sin fecha informada';
 const id=get(x,['id','codigo','puntoMedicion.id','estacion.id','datoMedicion.id'])||`DGI-${i+1}`;
 return {lat,lon,value,name,river,date,id,raw:x};
}
function color(v){if(v===null)return '#84939b';if(v>=100)return '#b30f20';if(v>=50)return '#f0522d';if(v>=20)return '#f49b2f';return '#36a269'}
async function locality(lat,lon,fallback){try{const u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=14&accept-language=es`;const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json(),a=j.address||{};return {place:a.city||a.town||a.village||a.hamlet||a.suburb||fallback,dept:a.county||a.state_district||a.state||'Mendoza'}}catch{return {place:fallback,dept:'Mendoza'}}}
function historyFromRaw(raw,current){let arr=get(raw,['historial','mediciones','datos','serie','values']);if(!Array.isArray(arr))arr=[];const pts=arr.map((e,i)=>({x:get(e,['fecha','fechaMedicion','date','timestamp'])||i,y:num(get(e,['valor','caudal','medicion','value']))})).filter(p=>p.y!==null).slice(-30);if(!pts.length&&current!==null)pts.push({x:'Actual',y:current});return pts}
async function show(p){document.getElementById('panel').classList.add('open');document.getElementById('detail').innerHTML='<div class="empty">Consultando localidad…</div>';const loc=await locality(p.lat,p.lon,p.name);const pts=historyFromRaw(p.raw,p.value);const v=p.value===null?'Sin dato':p.value.toLocaleString('es-AR',{maximumFractionDigits:2});document.getElementById('detail').innerHTML=`<div class="place">${loc.place}</div><div class="dept">${loc.dept}</div><span class="status">● Dato real DGI</span><div class="value">${v}</div><div class="unit">Caudal / medición informada por la fuente</div><div class="grid"><div class="box"><div class="lab">Punto</div><div class="val">${p.name}</div></div><div class="box"><div class="lab">Cauce o red</div><div class="val">${p.river}</div></div><div class="box"><div class="lab">Identificador</div><div class="val">${p.id}</div></div><div class="box"><div class="lab">Fecha fuente</div><div class="val">${p.date}</div></div></div><div class="chartWrap"><canvas id="chart"></canvas></div><div class="notice">Fuente: API pública de telemetría del Departamento General de Irrigación de Mendoza. Las coordenadas se usan internamente; en pantalla se prioriza la localidad obtenida por geocodificación inversa.</div>`;if(chart)chart.destroy();chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:pts.map(q=>String(q.x).slice(0,16)),datasets:[{label:'Medición',data:pts.map(q=>q.y),borderColor:'#1769aa',backgroundColor:'#1769aa22',fill:true,tension:.25,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:6}},y:{beginAtZero:true}}}})}
async function load(){const state=document.getElementById('loadState');try{const r=await fetch(DATA_URL,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();const raw=flattenPayload(j),points=raw.map(normalize).filter(p=>p.lat!==null&&p.lon!==null&&p.lat>-90&&p.lat<90&&p.lon>-180&&p.lon<180);if(!points.length)throw new Error('La respuesta no contiene coordenadas reconocibles');points.forEach(p=>{const c=color(p.value),icon=L.divIcon({className:'',html:`<div class="dot" style="width:18px;height:18px;background:${c}"></div>`,iconSize:[18,18],iconAnchor:[9,9]});L.marker([p.lat,p.lon],{icon}).bindTooltip(p.name).on('click',()=>show(p)).addTo(group)});map.fitBounds(group.getBounds().pad(.15));document.getElementById('counter').textContent=`Puntos reales: ${points.length}`;state.textContent=`Datos DGI cargados: ${points.length} puntos con ubicación.`}catch(e){state.innerHTML=`No se pudo leer directamente la API DGI: <b>${e.message}</b>. El HTML está preparado para datos reales, pero si el navegador bloquea CORS debes colocar tu Worker proxy en la constante DATA_URL.`;state.style.background='#fff1ee';state.style.color='#a23326'}}
document.getElementById('close').onclick=e=>{e.stopPropagation();document.getElementById('panel').classList.remove('open')};document.getElementById('panelTop').onclick=()=>document.getElementById('panel').classList.add('open');load();
</script></body></html>
