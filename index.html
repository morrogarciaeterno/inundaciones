<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NOVA TERRITORIA - Monitoreo Hídrico y Riesgo de Inundación</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        *{box-sizing:border-box}
        html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#081321;color:#eaf3ff;overflow:hidden}
        .app{height:100vh;width:100vw;display:grid;grid-template-columns:420px 1fr}
        .side{padding:18px;overflow-y:auto;border-right:1px solid #25405a;background:#0b192b;display:flex;flex-direction:column;height:100vh}
        h1{font-size:19px;margin:0 0 4px 0;display:flex;align-items:center;gap:8px}
        .muted{color:#8ea4bb;font-size:12px}
        .status{margin:10px 0;padding:10px;border-radius:10px;background:#10263b;font-size:12px;border:1px solid #1e3a5f}
        .big{font-size:30px;font-weight:900;color:#38bdf8;margin-top:4px}
        .pill{display:inline-block;padding:4px 10px;border-radius:16px;font-weight:700;font-size:11px}
        .pill.normal{background:#064e3b;color:#34d399}
        .pill.warning{background:#78350f;color:#fbbf24}
        .pill.danger{background:#7f1d1d;color:#f87171}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
        .box{padding:10px;border:1px solid #27445e;border-radius:10px;background:#0d1e32}
        .lab{font-size:9px;color:#8198ae;text-transform:uppercase;letter-spacing:.5px}
        .val{margin-top:4px;font-size:13px;font-weight:800}
        
        /* Selector de Regiones Ampliado con Noroeste */
        .region-select{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
        .btn-reg{background:#0f2744;border:1px solid #2c4d6f;padding:8px;font-size:11px;font-weight:700;border-radius:6px;cursor:pointer;color:#93c5fd;text-align:center}
        .btn-reg:hover, .btn-reg.active{background:#0369a1;color:#fff;border-color:#38bdf8}
        .btn-reg.full{grid-column: span 2;}

        .controls-group{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
        .btn-toggle{background:#047857;border:none;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:8px;color:#eaf3ff;font-size:12px;transition:background .2s}
        .btn-toggle:hover{background:#059669}
        .btn-toggle.off{background:#7f1d1d}
        .btn-toggle.off:hover{background:#991b1b}

        .chart{height:180px;border:1px solid #27445e;border-radius:10px;padding:10px;background:#0d1e32;margin-top:10px}
        .linechart{height:120px;width:100%;display:block}
        .gridline{stroke:#29445c;stroke-width:1}
        .flowline{fill:none;stroke:#38bdf8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .flowarea{fill:#38bdf81a}
        .flowdot{fill:#38bdf8;stroke:#dff6ff;stroke-width:1.5}
        
        .mapwrap{position:relative;height:100vh;width:100%}
        #map{height:100vh;width:100%;background:#081321}
        .top{position:absolute;z-index:600;top:12px;left:52px;background:#0b192bee;border:1px solid #27445e;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
        .dotLabel{font-size:11px;font-weight:600}
        
        button,input{background:#10263b;color:#eaf3ff;border:1px solid #31506b;border-radius:8px;padding:9px 12px;font-size:13px}
        input:focus{outline:none;border-color:#38bdf8}
        .search{width:100%;margin-top:8px}
        .btn-action{width:100%;margin-top:10px;background:#0369a1;border:none;cursor:pointer;font-weight:700;transition:background .2s}
        .btn-action:hover{background:#0284c7}

        .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        #detail { flex-grow: 1; margin-top: 10px; overflow-y: auto; }

        @media(max-width:760px){
            .app{display:block;height:auto}
            .side{position:relative;height:auto}
            .mapwrap,#map{height:50vh}
        }
    .scanbox{margin-top:8px;padding:10px;border:1px solid #27445e;border-radius:10px;background:#0d1e32}.scanrow{display:flex;justify-content:space-between;gap:8px;margin:4px 0;font-size:11px}.sat-date{width:100%;margin-top:6px;color-scheme:dark}.source-note{font-size:10px;color:#8ea4bb;line-height:1.35;margin-top:8px}
    </style>
</head>
<body>
<div class="app">
    <aside class="side">
        <div>
            <h1><span>💧</span> NOVA TERRITORIA</h1>
            <div class="muted">Plataforma Nacional de Contingencias Hídricas</div>
            
            <!-- Selector Ampliado con Noroeste (NOA) -->
            <div class="region-select">
                <button class="btn-reg active" onclick="setRegion(-32.89, -68.84, 10, this)">⛰️ Oeste (Cuyo)</button>
                <button class="btn-reg" onclick="setRegion(-24.78, -65.41, 10, this)">🌵 Noroeste (NOA)</button>
                <button class="btn-reg" onclick="setRegion(-27.45, -58.98, 10, this)">🌊 Norte (Litoral)</button>
                <button class="btn-reg" onclick="setRegion(-36.50, -57.70, 10, this)">🏖️ Este (Bs.As.)</button>
                <button class="btn-reg full" onclick="setRegion(-41.13, -71.30, 9, this)">🏔️ Sur (Patagonia)</button>
            </div>

            <input class="search" id="q" placeholder="Buscar estación o código DGI...">
            <div class="status" id="status">Consultando DGI…</div>
            
            <div class="controls-group">
                <button id="toggleDgiBtn" class="btn-toggle">
                    <span id="dgiIcon">👁️</span> <span id="dgiText">Ocultar Estaciones DGI</span>
                </button>
                <button id="toggleIgnBtn" class="btn-toggle">
                    <span id="ignIcon">👁️</span> <span id="ignText">Ocultar Zonas de Inundación (IGN)</span>
                </button>
                <button id="toggleNasaBtn" class="btn-toggle off">🛰️ Mostrar NASA VIIRS · 2 días</button>
                <input id="floodDate" class="sat-date" type="date" aria-label="Fecha satelital">
                <button id="scanGfmBtn" class="btn-action" style="background:#7c3aed">🛰️ Analizar inundación en esta vista</button>
                <div id="scanStatus" class="scanbox" style="display:none"></div>
            </div>
        </div>

        <div id="detail">
            <div class="muted" style="text-align:center;padding:30px 0;">Selecciona una región o estación en el mapa para auditar el riesgo hídrico nacional.</div>
        </div>
    </aside>
    <main class="mapwrap">
        <div class="top" id="count">Estaciones: --</div>
        <div id="map"></div>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script>
const DGI_WORKER = 'https://dgi-proxy.elexpreso17.workers.dev/';
const KEY = c => 'territoria_dgi_hist_' + c;
let rows = [], markers = [], selected = null;
let dgiVisible = true;
let ignVisible = true; let nasaVisible=false;
const gfmFloodLayer=L.layerGroup().addTo(map);

const map = L.map('map', {preferCanvas: true}).setView([-32.89, -68.84], 10);
setTimeout(() => { map.invalidateSize(); }, 200);

const baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
    className: 'dark-tiles' 
}).addTo(map);

const ignRiesgoLayer = L.tileLayer.wms('https://wms.ign.gob.ar/geoserver/ign_riesgo/ows?', {
    layers: 'amenaza_inundacion', 
    format: 'image/png',
    transparent: true,
    version: '1.1.1',
    attribution: 'IGN - IG-GIRD',
    opacity: 0.8
}).addTo(map);
const nasaFloodLayer=L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi',{layers:'VIIRS_Combined_Flood_2-Day',format:'image/png',transparent:true,version:'1.1.1',opacity:.62,attribution:'NASA EOSDIS LANCE / GIBS · VIIRS'});

const layer = L.layerGroup().addTo(map);

L.control.layers({ "Mapa Base Oscuro": baseLayer }, { "Amenaza IGN": ignRiesgoLayer, "NASA VIIRS · 2 días": nasaFloodLayer, "GFM analizado": gfmFloodLayer, "Estaciones DGI": layer }, { position: 'topleft' }).addTo(map);

function setRegion(lat, lon, zoom, btn) {
    map.setView([lat, lon], zoom);
    setTimeout(() => { map.invalidateSize(); }, 100);
    document.querySelectorAll('.btn-reg').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

const n = v => { 
    if (v === null || v === undefined) return null;
    let s = String(v).replace(',', '.');
    return Number.isFinite(Number(s)) ? Number(s) : null; 
};
const fmt = v => n(v) === null ? 'S/D' : Number(v).toLocaleString('es-AR', {maximumFractionDigits: 2});

function hist(code) {
    try {
        let a = JSON.parse(localStorage.getItem(KEY(code)) || '[]');
        return Array.isArray(a) ? a : [];
    } catch { return []; }
}

function store(st) {
    let q = n(st.caudal), t = Date.parse(st.fecha || '');
    if (q === null || !Number.isFinite(t)) return;
    let a = hist(st.codigo);
    if (!a.some(x => x.t === t)) {
        a.push({ t, q, h: n(st.altura) });
        localStorage.setItem(KEY(st.codigo), JSON.stringify(a.slice(-15)));
    }
}

function lineSvg(a) {
    if (!a.length) return '<div class="muted" style="padding-top:40px;text-align:center">Sin historial local registrado todavía</div>';
    let vals = a.map(x => x.q).filter(Number.isFinite), lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi === lo) { hi = lo + 1; lo = Math.max(0, lo - 1); }
    let W = 330, H = 110, P = 12, dx = a.length > 1 ? (W - 2 * P) / (a.length - 1) : 0;
    let pts = a.map((x, i) => {
        let X = P + i * dx, Y = H - P - ((x.q - lo) / (hi - lo)) * (H - 2 * P);
        return [X, Y, x];
    });
    let poly = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    let area = `${P},${H-P} ${poly} ${pts.at(-1)[0]},${H-P}`;
    return `<svg class="linechart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <line class="gridline" x1="0" y1="${H/2}" x2="${W}" y2="${H/2}"/><polygon class="flowarea" points="${area}"/><polyline class="flowline" points="${poly}"/>
        ${pts.map(p => `<circle class="flowdot" cx="${p[0]}" cy="${p[1]}" r="3"><title>${fmt(p[2].q)} l/s · ${new Date(p[2].t).toLocaleString('es-AR')}</title></circle>`).join('')}
    </svg>`;
}

function trend(a) {
    let x = a.slice(-3).map(v => v.q);
    if (x.length < 2) return ['◇', 'Sin historial suficiente', 'normal'];
    let d = x.at(-1) - x.at(-2);
    if (x.length >= 3 && x[0] < x[1] && x[1] < x[2]) return ['↗', 'Crecimiento persistente (Riesgo Aluvional)', 'warning'];
    if (d > 0) return ['↑', 'Caudal en aumento', 'warning'];
    if (d < 0) return ['↓', 'Caudal en descenso', 'normal'];
    return ['→', 'Estable', 'normal'];
}

function exportCSV(code, name) {
    let a = hist(code);
    if (!a.length) { alert('No hay datos históricos para exportar.'); return; }
    let csv = 'Fecha,Caudal (l/s),Altura (cm)\n' + a.map(x => `"${new Date(x.t).toLocaleString('es-AR')}",${x.q},${x.h ?? ''}`).join('\n');
    let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    let url = URL.createObjectURL(blob);
    let link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `dgi_${code}_${name.replace(/[^a-zA-Z0-9]/g, '_')}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function show(st) {
    selected = st;
    store(st);
    let a = hist(st.codigo), tr = trend(a);
    document.getElementById('detail').innerHTML = `
        <div style="margin-top:5px">
            <b style="font-size:18px">${st.nombre || 'Estación Hidrométrica'}</b>
            <div class="muted">Código DGI: ${st.codigo || '--'}</div>
            <div style="margin:6px 0"><span class="pill ${tr[2]}">${tr[0]} ${tr[1]}</span></div>
            <div class="big">${fmt(st.caudal)} <span style="font-size:14px;color:#8ea4bb">${st.unidadCaudal || 'l/s'}</span></div>
            <div class="muted">Caudal actual registrado</div>
            
            <div class="grid">
                <div class="box"><div class="lab">Altura Nivel</div><div class="val">${fmt(st.altura)} ${st.unidadAltura || 'cm'}</div></div>
                <div class="box"><div class="lab">Última Lectura</div><div class="val" style="font-size:11px">${st.fecha ? new Date(st.fecha).toLocaleString('es-AR') : 'S/D'}</div></div>
                <div class="box"><div class="lab">Registros Locales</div><div class="val">${a.length} / 15 lecturas</div></div>
                <div class="box"><div class="lab">Ubicación GPS</div><div class="val" style="font-size:11px">${fmt(st.latitud)}, ${fmt(st.longitud)}</div></div>
            </div>

            <div class="chart"><div class="muted" style="margin-bottom:4px">Evolución temporal del caudal</div>${lineSvg(a)}</div>
            <button class="btn-action" onclick="exportCSV('${st.codigo}', '${st.nombre || 'estacion'}')">📥 Exportar Historial CSV</button>
        </div>`;
}

function render(list) {
    layer.clearLayers();
    markers = [];
    let pts = [];
    list.forEach(st => {
        let a = n(st.latitud), b = n(st.longitud);
        if (a === null || b === null) return;
        pts.push([a, b]);
        store(st);
        let tr = trend(hist(st.codigo));
        let color = tr[2] === 'warning' ? '#f59e0b' : '#38bdf8';
        let mk = L.circleMarker([a, b], {
            radius: 7, color: '#fff', weight: 2, fillColor: color, fillOpacity: .95
        }).bindTooltip(st.nombre || String(st.codigo), {className: 'dotLabel'})
          .on('click', () => show(st));
        
        if (dgiVisible) {
            mk.addTo(layer);
        }
        markers.push({mk, st});
    });
    document.getElementById('count').textContent = `Estaciones: ${pts.length}`;
}

async function load() {
    try {
        let r = await fetch(DGI_WORKER, {cache: 'no-store'});
        if (!r.ok) throw Error('HTTP ' + r.status);
        let j = await r.json();
        if (!j.ok || !Array.isArray(j.estaciones)) throw Error(j.error || 'Respuesta inválida');
        rows = j.estaciones.filter(x => x && x.habilitada !== false);
        render(rows);
        document.getElementById('status').textContent = `Sincronizado: ${rows.length} estaciones activas · Refresco 5 min`;
        setInterval(load, 300000);
    } catch (e) {
        document.getElementById('status').textContent = 'Error DGI: ' + e.message;
    }
}

document.getElementById('q').addEventListener('input', e => {
    let q = e.target.value.toLowerCase().trim();
    render(!q ? rows : rows.filter(x => String(x.nombre || '').toLowerCase().includes(q) || String(x.codigo || '').toLowerCase().includes(q)));
});

document.getElementById('toggleDgiBtn').addEventListener('click', function() {
    dgiVisible = !dgiVisible;
    if (dgiVisible) {
        if (!map.hasLayer(layer)) map.addLayer(layer);
        render(rows);
        this.classList.remove('off');
        document.getElementById('dgiIcon').textContent = '👁️';
        document.getElementById('dgiText').textContent = 'Ocultar Estaciones DGI';
    } else {
        if (map.hasLayer(layer)) map.removeLayer(layer);
        this.classList.add('off');
        document.getElementById('dgiIcon').textContent = '❌';
        document.getElementById('dgiText').textContent = 'Mostrar Estaciones DGI';
    }
});

document.getElementById('toggleIgnBtn').addEventListener('click', function() {
    ignVisible = !ignVisible;
    if (ignVisible) {
        if (!map.hasLayer(ignRiesgoLayer)) map.addLayer(ignRiesgoLayer);
        this.classList.remove('off');
        document.getElementById('ignIcon').textContent = '👁️';
        document.getElementById('ignText').textContent = 'Ocultar Zonas de Inundación (IGN)';
    } else {
        if (map.hasLayer(ignRiesgoLayer)) map.removeLayer(ignRiesgoLayer);
        this.classList.add('off');
        document.getElementById('ignIcon').textContent = '❌';
        document.getElementById('ignText').textContent = 'Mostrar Zonas de Inundación (IGN)';
    }
});


const floodDateInput=document.getElementById('floodDate'); const d=new Date();d.setDate(d.getDate()-1);floodDateInput.value=d.toISOString().slice(0,10);nasaFloodLayer.setParams({time:floodDateInput.value},false);
document.getElementById('toggleNasaBtn').onclick=function(){nasaVisible=!nasaVisible;if(nasaVisible){nasaFloodLayer.setParams({time:floodDateInput.value},false).addTo(map);this.classList.remove('off');this.textContent='👁️ Ocultar NASA VIIRS · 2 días'}else{map.removeLayer(nasaFloodLayer);this.classList.add('off');this.textContent='🛰️ Mostrar NASA VIIRS · 2 días'}};
floodDateInput.onchange=()=>nasaFloodLayer.setParams({time:floodDateInput.value},true);
const safe=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
async function zoneName(lat,lon){try{const r=await fetch(`https://apis.datos.gob.ar/georef/api/ubicacion?lat=${lat}&lon=${lon}`);const j=await r.json(),x=j.ubicacion||j;return [x.localidad?.nombre||x.municipio?.nombre||x.departamento?.nombre,x.departamento?.nombre,x.provincia?.nombre].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' · ')}catch{return 'Zona analizada'}}
const scanStatus=document.getElementById('scanStatus');function msg(x){scanStatus.style.display='block';scanStatus.innerHTML=x}function viewBBox(){const b=map.getBounds();return[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]}
function getAsset(i){const a=i.assets||{};for(const k of ['ensemble_flood_extent','observed_flood_extent','flood_extent'])if(a[k]?.href)return a[k].href;const e=Object.entries(a).find(([k,v])=>v?.href&&/flood.*extent|ensemble.*flood/i.test(k+' '+(v.title||'')));return e?.[1]?.href}
async function scanGfm(){const btn=document.getElementById('scanGfmBtn');btn.disabled=true;btn.textContent='⏳ Analizando Sentinel-1…';gfmFloodLayer.clearLayers();msg('<b>Copernicus GFM</b><div class="muted">Buscando escenas y leyendo píxeles de inundación…</div>');try{if(typeof GeoTIFF==='undefined')throw Error('GeoTIFF no disponible');const end=new Date(floodDateInput.value+'T23:59:59Z'),start=new Date(end);start.setDate(start.getDate()-6);const rr=await fetch('https://stac.eodc.eu/api/v1/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collections:['GFM'],bbox:viewBBox(),datetime:start.toISOString()+'/'+end.toISOString(),limit:20})});if(!rr.ok)throw Error('STAC HTTP '+rr.status);const jj=await rr.json(),items=(jj.features||[]).filter(getAsset).slice(0,8);if(!items.length){msg('<b>Sin escenas GFM</b><div class="muted">No hay pasadas procesadas para esta vista y período.</div>');return}let pts=[],done=0,positive=0,last='';for(const item of items){try{const t=await GeoTIFF.fromUrl(getAsset(item)),im=await t.getImage(),ib=im.getBoundingBox(),mb=viewBBox(),bb=[Math.max(ib[0],mb[0]),Math.max(ib[1],mb[1]),Math.min(ib[2],mb[2]),Math.min(ib[3],mb[3])];if(bb[0]>=bb[2]||bb[1]>=bb[3])continue;const W=120,H=120,r=await im.readRasters({bbox:bb,width:W,height:H,interleave:true,resampleMethod:'nearest'});let hit=0;for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(Number(r[y*W+x])===1){hit++;if(pts.length<1200){const lon=bb[0]+(x+.5)/W*(bb[2]-bb[0]),lat=bb[3]-(y+.5)/H*(bb[3]-bb[1]);pts.push([lat,lon]);L.circleMarker([lat,lon],{radius:2,stroke:false,fillColor:'#ff2438',fillOpacity:.85}).addTo(gfmFloodLayer)}}if(hit)positive++;last=item.properties?.datetime||last;done++;}catch(e){done++}}
const z=await zoneName((pts[0]||map.getCenter()).lat??pts[0]?.[0],(pts[0]||map.getCenter()).lng??pts[0]?.[1]);msg(`<b>Resultado GFM · Sentinel-1</b><div class="scanrow"><span>Escenas</span><b>${done}</b></div><div class="scanrow"><span>Con inundación</span><b>${positive}</b></div><div class="scanrow"><span>Muestras rojas</span><b>${pts.length}</b></div><div class="scanrow"><span>Zona aproximada</span><b>${safe(z)}</b></div><div class="scanrow"><span>Adquisición</span><b>${last?new Date(last).toLocaleString('es-AR'):'S/D'}</b></div><div class="source-note">Rojo: píxeles clasificados como inundación por Observed Flood Extent. Muestreo de pantalla, no confirmación oficial.</div>`);if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[25,25],maxZoom:10});}catch(e){msg(`<b>Análisis no disponible</b><div class="muted">${safe(e.message)}</div>`)}finally{btn.disabled=false;btn.textContent='🛰️ Analizar inundación en esta vista'}}
document.getElementById('scanGfmBtn').onclick=scanGfm;

load();
</script>
</body>
</html>
