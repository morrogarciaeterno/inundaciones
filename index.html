<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Territoria - Testing hídrico</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#081321;color:#eaf3ff}.app{height:100%;display:grid;grid-template-columns:390px 1fr}.side{padding:15px;overflow:auto;border-right:1px solid #25405a;background:#0b192b}h1{font-size:19px;margin:0}.muted{color:#8ea4bb;font-size:12px}.status{margin:12px 0;padding:10px;border-radius:10px;background:#10263b;font-size:12px}.big{font-size:34px;font-weight:900;color:#38bdf8}.pill{display:inline-block;padding:5px 9px;border-radius:16px;background:#10372f;color:#5ee3a6;font-weight:800;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.box{padding:10px;border:1px solid #27445e;border-radius:10px;background:#0d1e32}.lab{font-size:9px;color:#8198ae}.val{margin-top:4px;font-size:12px;font-weight:800}.chart{height:210px;border:1px solid #27445e;border-radius:10px;padding:10px}.linechart{height:155px;width:100%;display:block}.gridline{stroke:#29445c;stroke-width:1}.flowline{fill:none;stroke:#38bdf8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.flowarea{fill:#38bdf81a}.flowdot{fill:#38bdf8;stroke:#dff6ff;stroke-width:1.5}.trend{margin-top:10px;padding:10px;border-radius:10px;background:#10263b;font-weight:800;font-size:12px}.mapwrap{position:relative}#map{height:100%}.top{position:absolute;z-index:600;top:12px;left:52px;background:#0b192bee;border:1px solid #27445e;border-radius:10px;padding:8px 10px}.dotLabel{font-size:11px}button,input{background:#10263b;color:#eaf3ff;border:1px solid #31506b;border-radius:8px;padding:8px}.search{width:100%;margin-top:10px}@media(max-width:760px){.app{display:block}.mapwrap{height:100%}.side{position:fixed;z-index:900;left:0;right:0;bottom:0;height:45%;border-radius:18px 18px 0 0;border-right:0}.mapwrap,#map{height:100%}}
</style></head><body><div class="app"><aside class="side"><h1>💧 Testing hídrico Territoria</h1><div class="muted">Parte hídrica extraída para trabajarla de forma aislada.</div><input class="search" id="q" placeholder="Buscar estación o código..."><div class="status" id="status">Consultando DGI…</div><div id="detail"><div class="muted">Toca una estación del mapa.</div></div></aside><main class="mapwrap"><div class="top" id="count">Puntos: --</div><div id="map"></div></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const DGI_WORKER='https://dgi-proxy.elexpreso17.workers.dev/'; const KEY=c=>'territoria_dgi_hist_'+c; let rows=[],markers=[],selected=null;
const map=L.map('map',{preferCanvas:true}).setView([-34.05,-68.65],7);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);const layer=L.layerGroup().addTo(map);
const n=v=>Number.isFinite(Number(v))?Number(v):null; const fmt=v=>n(v)===null?'S/D':Number(v).toLocaleString('es-AR',{maximumFractionDigits:2});
function hist(code){try{let a=JSON.parse(localStorage.getItem(KEY(code))||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function store(st){let q=n(st.caudal),t=Date.parse(st.fecha||'');if(q===null||!Number.isFinite(t))return;let a=hist(st.codigo);if(!a.some(x=>x.t===t)){a.push({t,q,h:n(st.altura)});localStorage.setItem(KEY(st.codigo),JSON.stringify(a.slice(-12)))}}
function lineSvg(a){if(!a.length)return '<div class="muted" style="padding-top:55px;text-align:center">Sin historial todavía</div>';let vals=a.map(x=>x.q).filter(Number.isFinite),lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo){hi=lo+1;lo=Math.max(0,lo-1)};let W=330,H=140,P=12,dx=a.length>1?(W-2*P)/(a.length-1):0;let pts=a.map((x,i)=>{let X=P+i*dx,Y=H-P-((x.q-lo)/(hi-lo))*(H-2*P);return [X,Y,x]}),poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),area=`${P},${H-P} ${poly} ${pts.at(-1)[0]},${H-P}`;return `<svg class="linechart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="gridline" x1="0" y1="${H/2}" x2="${W}" y2="${H/2}"/><polygon class="flowarea" points="${area}"/><polyline class="flowline" points="${poly}"/>${pts.map(p=>`<circle class="flowdot" cx="${p[0]}" cy="${p[1]}" r="3"><title>${fmt(p[2].q)} · ${new Date(p[2].t).toLocaleString('es-AR')}</title></circle>`).join('')}</svg>`} 
function trend(a){let x=a.slice(-3).map(v=>v.q);if(x.length<2)return['◇','Sin historial suficiente'];let d=x.at(-1)-x.at(-2);if(x.length>=3&&x[0]<x[1]&&x[1]<x[2])return['↗','Crecimiento persistente'];if(d>0)return['↑','Caudal en aumento'];if(d<0)return['↓','Caudal en descenso'];return['→','Estable']}
function show(st){selected=st;store(st);let a=hist(st.codigo),tr=trend(a),max=Math.max(...a.map(x=>x.q),1);document.getElementById('detail').innerHTML=`<div style="margin-top:15px"><b style="font-size:20px">${st.nombre||'Estación DGI'}</b><div class="muted">DGI ${st.codigo||'--'}</div><p><span class="pill">Dato DGI</span></p><div class="big">${fmt(st.caudal)}</div><div class="muted">${st.unidadCaudal||'l/s'} · caudal</div><div class="grid"><div class="box"><div class="lab">ALTURA</div><div class="val">${fmt(st.altura)} ${st.unidadAltura||'cm'}</div></div><div class="box"><div class="lab">REGISTRO</div><div class="val">${st.fecha?new Date(st.fecha).toLocaleString('es-AR'):'S/D'}</div></div><div class="box"><div class="lab">HISTORIAL LOCAL</div><div class="val">${a.length}/12 lecturas</div></div><div class="box"><div class="lab">COORDENADAS</div><div class="val">${fmt(st.latitud)}, ${fmt(st.longitud)}</div></div></div><div class="chart"><div class="muted">Evolución del caudal · últimas lecturas</div>${lineSvg(a)}</div><div class="trend">${tr[0]} ${tr[1]}</div></div>`}
function render(list){layer.clearLayers();markers=[];let pts=[];list.forEach(st=>{let a=n(st.latitud),b=n(st.longitud);if(a===null||b===null)return;pts.push([a,b]);store(st);let tr=trend(hist(st.codigo)),c=tr[1].includes('persistente')?'#f59e0b':tr[1].includes('aumento')?'#38bdf8':tr[1].includes('descenso')?'#34d399':'#22d3ee';let mk=L.circleMarker([a,b],{radius:6,color:'#fff',weight:2,fillColor:c,fillOpacity:.9}).bindTooltip(st.nombre||String(st.codigo),{className:'dotLabel'}).on('click',()=>show(st)).addTo(layer);markers.push({mk,st})});document.getElementById('count').textContent=`Puntos: ${pts.length}`}
async function load(){try{let r=await fetch(DGI_WORKER,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!j.ok||!Array.isArray(j.estaciones))throw Error(j.error||'Respuesta inválida');rows=j.estaciones.filter(x=>x&&x.habilitada!==false);render(rows);document.getElementById('status').textContent=`DGI cargado: ${rows.length} estaciones · actualización cada 5 min`;setInterval(load,300000)}catch(e){document.getElementById('status').textContent='DGI no disponible: '+e.message}}
document.getElementById('q').addEventListener('input',e=>{let q=e.target.value.toLowerCase().trim();render(!q?rows:rows.filter(x=>String(x.nombre||'').toLowerCase().includes(q)||String(x.codigo||'').toLowerCase().includes(q)))});load();
</script></body></html>
